<title>GlobalPlay Admin</title>
<style>
:root{--bg:#14110f;--card:#211c18;--fg:#f3ece4;--mut:#a89d92;--acc:#e8a33d;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
#warn{background:#5a2a12;color:#ffd699;padding:8px 12px;font-size:13px;text-align:center}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px;background:#1b1612}
nav button{background:none;border:0;color:var(--mut);padding:8px 12px;border-radius:8px;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--card);color:var(--acc)}
main{max-width:1000px;margin:auto;padding:12px}
.box{background:var(--card);border-radius:10px;padding:14px;margin:10px 0}
input,select,textarea{background:#14110f;color:var(--fg);border:1px solid #4a3f35;border-radius:6px;padding:8px;width:100%;margin:3px 0 8px;font:inherit}
button.b{background:var(--acc);color:#14110f;border:0;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer}
button.b.alt{background:#342d27;color:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.stats div{background:#14110f;padding:10px;border-radius:8px}.stats b{font-size:22px;display:block}
.mv{display:flex;gap:10px;align-items:flex-start;border-top:1px solid #342d27;padding:10px 0}.mv img{width:54px;border-radius:4px}
.mut{color:var(--mut);font-size:12px}.err{color:#ff9b8a}.ok{color:#9bd89b}
label{font-size:13px;color:var(--mut)}:focus-visible{outline:2px solid var(--acc)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}

:root{--bg:#000;--card:#0e0e12;--fg:#f5f3ff;--mut:#8f8aa3;--c1:#8b5cf6;--c2:#ff4d7e;--c3:#22d3ee;--g:linear-gradient(120deg,var(--acc),var(--c2) 55%,var(--c1))}
body{background:radial-gradient(60% 40% at 85% -5%,#8b5cf633,transparent),radial-gradient(50% 35% at 0 12%,#ff4d7e22,transparent),#000;background-attachment:fixed;font-family:Inter,"SF Pro Display",system-ui,sans-serif}
.sr{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;margin:0}
.dd{position:relative;display:block;margin:3px 0 8px}
.ddb{width:100%;text-align:left;background:#0e0e12;color:var(--fg);border:1px solid #2a2740;border-radius:12px;padding:10px 36px 10px 12px;font:inherit;cursor:pointer;position:relative;transition:border-color .2s}
.ddb:after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border:solid var(--mut);border-width:0 2px 2px 0;transform:translateY(-70%) rotate(45deg);transition:transform .2s}
.dd.open .ddb{border-color:var(--c1)}.dd.open .ddb:after{transform:translateY(-30%) rotate(225deg)}
.dd ul{display:none;position:absolute;z-index:50;left:0;right:0;top:calc(100% + 6px);max-height:260px;overflow:auto;margin:0;padding:6px;list-style:none;background:#101016f2;backdrop-filter:blur(18px);border:1px solid #2a2740;border-radius:14px;box-shadow:0 20px 50px #000}
.dd.open ul{display:block}
.dd li{padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--fg);font-size:14px}
.dd li:hover,.dd li:focus{background:#8b5cf633;outline:0}.dd li[aria-selected=true]{background:var(--g);color:#000;font-weight:600}

nav{position:sticky;top:0;z-index:20;backdrop-filter:blur(18px);background:#000c;border-bottom:1px solid #ffffff12}
nav button{border-radius:999px;transition:background .2s}nav button.on{background:var(--g);color:#000;font-weight:600}
.box{background:var(--card);border:1px solid #ffffff12;border-radius:18px}
button.b{background:var(--g);border-radius:999px;color:#000}button.b.alt{background:#ffffff14;color:var(--fg)}
input,textarea{background:#08080c;border-color:#2a2740;border-radius:12px}
.stats div{background:#08080c;border:1px solid #ffffff10;border-radius:14px}
.pend{opacity:.6}
.stats b{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
#warn{background:#2a1208}

/* ===== Brand logo + loader ===== */
.gl{display:block;flex:none;object-fit:contain}
.logo.has-ic{display:flex;align-items:center;gap:8px;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:inherit}
.logo.big.has-ic{display:inline-flex;gap:10px}
.logo .lt{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
#gpl{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:radial-gradient(60% 40% at 85% -5%,#8b5cf633,transparent),radial-gradient(50% 35% at 0 12%,#ff4d7e22,transparent),#000;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s .3s}
#gpl.on{opacity:1;visibility:visible;transition:opacity .15s ease}
.gpl-in{display:grid;justify-items:center;gap:20px;font:500 14px/1 system-ui,sans-serif;color:#a9a3c0;letter-spacing:.02em}
.gpl-in p{margin:0}
.gpl-ic{position:relative;width:76px;height:76px;display:grid;place-items:center}
.gpl-ic i{position:absolute;inset:-12px;border-radius:50%;background:conic-gradient(#ff2d4d,#ff4d7e,#8b5cf6,#ff2d4d);filter:blur(20px);opacity:.42;animation:gplspin 2.6s linear infinite;will-change:transform}
.gpl-ic img{position:relative;width:76px;height:76px;animation:gplpulse 1.7s ease-in-out infinite;filter:drop-shadow(0 6px 16px #8b5cf655);will-change:transform}
@keyframes gplspin{to{transform:rotate(360deg)}}
@keyframes gplpulse{0%,100%{transform:scale(.94)}50%{transform:scale(1.05)}}
@media(prefers-reduced-motion:reduce){.gpl-ic i,.gpl-ic img{animation:none}}

 return{title:d.title,overview:d.overview||'',poster:d.poster_path||null,backdrop:d.backdrop_path||null,releaseDate:d.release_date||'',runtime:d.runtime||null,

function upsert(tmdbId,meta){const list=DB.get('movies',[]);let m=list.find(x=>x.tmdbId===tmdbId),isNew=!m;
 if(isNew){m={id:uid(),tmdbId,source:'tmdb',access:'unpublished',published:false,video:null,featured:false,addedAt:Date.now()};list.push(m)}

 <input id="uq" placeholder="Filter by email" value="${esc(q)}" oninput="usersTab();$('#uq').focus()">
 ${rows.length?'':'<p class="mut">No users match.</p>'}
 ${rows.map(x=>{const s=act(x.id),p=s&&pl.find(y=>y.id===s.planId),me=ME&&x.id===ME.id;return `<div class="mv"><div style="flex:1"><b>${esc(x.email)}</b> ${x.role==='admin'?'<span class="ok">(admin)</span>':''} ${x.disabled?'<span class="err">(disabled)</span>':''}<br>
 <span class="mut">Joined ${fmt(x.created)} | Last login ${fmt(x.lastLogin)} | ${a.filter(e=>e.userId===x.id).length} recent activities | ${p?'Plan: '+esc(p.name):s?'Active plan':'No active plan'}</span><br>
 ${me?'':`<button class="b alt" onclick="userToggle('${x.id}')">${x.disabled?'Enable':'Disable'}</button> `}<button class="b alt" onclick="userActs('${x.id}')">View activity</button> ${me?'':`<button class="b alt" onclick="userDel('${x.id}')">Delete</button>`}
 <div class="row2"><select id="gp${x.id}" aria-label="Plan"><option value="">Grant plan…</option>${pl.map(y=>`<option value="${y.id}">${esc(y.name)}</option>`).join('')}</select><button class="b alt" onclick="userGrant('${x.id}')">Grant</button>${s?`<button class="b alt" onclick="userRevoke('${x.id}')">Revoke plan</button>`:''}</div></div></div>`}).join('')}</div>`)}
function userToggle(id){const l=DB.get('users',[]),u=l.find(x=>x.id===id);u.disabled=!u.disabled;DB.set('users',l);alog(u.disabled?'admin_disable_user':'admin_enable_user','',u.email);audit((u.disabled?'disabled ':'enabled ')+u.email);usersTab()}
async function userDel(id){const u=DB.get('users',[]).find(x=>x.id===id);if(!u||!confirm('Delete '+u.email+'? Their watch history, watchlist and subscriptions are deleted too.'))return;
 const{error}=await sb.rpc('admin_delete_user',{p_user:id});if(error){msg='<span class="err">'+esc(error.message)+'</span>';return usersTab()}
 alog('admin_delete_user','',u.email);audit('deleted user '+u.email);await hydrateAdmin();msg='User deleted.';usersTab()}
function userGrant(id){const pid=$('#gp'+id).value;if(!pid)return;const pl=DB.get('plans',[]).find(p=>p.id===pid),l=DB.get('subs',[]);
 l.push({id:uid(),userId:id,planId:pid,status:'active',startedAt:Date.now(),expires:Date.now()+(pl.interval==='year'?365:30)*864e5});DB.set('subs',l);audit('granted plan '+pl.name);usersTab()}
function userRevoke(id){DB.set('subs',DB.get('subs',[]).map(s=>s.userId===id&&s.status==='active'?{...s,status:'cancelled'}:s));audit('revoked plan');usersTab()}
function userActs(id){const u=DB.get('users',[]).find(x=>x.id===id);af={u:u?u.email:'',t:''};tab='activity';draw()}
function activityTab(){const a=DB.get('activity',[]).slice().reverse(),types=[...new Set(a.map(x=>x.type))].sort();
 const l=a.filter(x=>(!af.t||x.type===af.t)&&(!af.u||(x.email||'').toLowerCase().includes(af.u.toLowerCase())));
 out(`<div class="box"><h3>User activity (latest ${a.length} of ${(C._n||{}).activity??'?'})</h3><p class="mut">Recorded by the apps as users act.</p>
 <div class="row2"><input placeholder="Filter by email" value="${esc(af.u)}" onchange="af.u=this.value;activityTab()" aria-label="Email filter"><select aria-label="Event type" onchange="af.t=this.value;activityTab()"><option value="">All event types</option>${types.map(t=>`<option ${af.t===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
 <button class="b" onclick="actCsv()">Export CSV</button> <button class="b alt" onclick="actClear()">Clear log</button>
 ${l.length?'':'<p class="mut">No matching activity.</p>'}
 ${l.slice(0,150).map(x=>`<div class="mv"><div style="flex:1"><b>${esc(x.type)}</b> <span class="mut">${fmt(x.at)} | ${esc(x.email||'anonymous')} | ${esc(x.source||'')}</span><br><span class="mut">${esc(x.detail||'')}</span></div></div>`).join('')}
 ${l.length>150?`<p class="mut">Showing 150 of ${l.length}. Export CSV for everything loaded.</p>`:''}</div>
 <div class="box"><h3>Admin changes</h3>${DB.get('audit',[]).slice(-15).reverse().map(x=>`<p class="mut">${fmt(x.at)}: ${esc(x.action)}</p>`).join('')||'<p class="mut">None.</p>'}</div>`)}
function actCsv(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',rows=[['time','type','email','source','detail'],...DB.get('activity',[]).map(x=>[new Date(x.at).toISOString(),x.type,x.email,x.source,x.detail])];
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download='globalplay-activity.csv';a.click()}
async function actClear(){if(!confirm('Delete all activity records? This cannot be undone.'))return;const{error}=await sb.from('activity').delete().gt('id',0);
 if(error){msg='<span class="err">'+esc(error.message)+'</span>';return activityTab()}audit('activity log cleared');await hydrateAdmin();msg='Activity log cleared.';activityTab()}

function enhance(root){root.querySelectorAll('select:not([data-e])').forEach(s=>{s.dataset.e=1;s.classList.add('sr');
 const w=document.createElement('div'),b=document.createElement('button'),u=document.createElement('ul');
 w.className='dd';b.type='button';b.className='ddb';b.setAttribute('aria-haspopup','listbox');b.setAttribute('aria-expanded','false');
 if(s.getAttribute('aria-label'))b.setAttribute('aria-label',s.getAttribute('aria-label'));u.setAttribute('role','listbox');
 const sync=()=>{b.textContent=s.options[s.selectedIndex]?s.options[s.selectedIndex].text:'';[...u.children].forEach((li,i)=>li.setAttribute('aria-selected',i===s.selectedIndex))};
 const shut=()=>{w.classList.remove('open');b.setAttribute('aria-expanded','false')};
 [...s.options].forEach((o,i)=>{const li=document.createElement('li');li.setAttribute('role','option');li.tabIndex=-1;li.textContent=o.text;
  li.onclick=()=>{s.selectedIndex=i;sync();shut();s.dispatchEvent(new Event('change',{bubbles:true}))};
  li.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();li.click()}if(e.key==='ArrowDown'){e.preventDefault();(li.nextElementSibling||li).focus()}if(e.key==='ArrowUp'){e.preventDefault();(li.previousElementSibling||li).focus()}if(e.key==='Escape'){shut();b.focus()}};u.append(li)});
 b.onclick=e=>{e.stopPropagation();document.querySelectorAll('.dd.open').forEach(d=>d!==w&&d.classList.remove('open'));const o=w.classList.toggle('open');b.setAttribute('aria-expanded',o);if(o)(u.children[s.selectedIndex]||u.firstChild).focus()};
 s.after(w);w.append(b,u);sync()})}
document.addEventListener('click',()=>document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open')));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open'))});
new MutationObserver(()=>enhance($('#app'))).observe($('#app'),{childList:true});enhance($('#app'));

boot();
</script></body></html>
