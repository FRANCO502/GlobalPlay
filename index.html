<title>GlobalPlay</title>
<style>
:root{--bg:#14110f;--card:#211c18;--fg:#f3ece4;--mut:#a89d92;--acc:#e8a33d;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Georgia,'Times New Roman',serif;padding-bottom:72px}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#env{background:#3a2a12;color:#ffd699;font:12px system-ui;padding:6px 12px;text-align:center}
header{display:flex;align-items:center;gap:16px;padding:12px 16px}
.logo{font-size:22px;font-weight:700;letter-spacing:.02em}.logo b{color:var(--acc)}
nav.top{display:none;gap:4px;margin-left:auto}
nav button,.btn{background:none;border:0;padding:8px 12px;border-radius:8px;font-family:system-ui}
nav button.on{color:var(--acc)}
.btn{background:var(--acc);color:#14110f;font-weight:600}.btn.alt{background:#342d27;color:var(--fg)}
nav.bot{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#1b1612;border-top:1px solid #342d27;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
nav.bot button{font-size:12px;padding:6px 8px}
@media(min-width:760px){nav.top{display:flex}nav.bot{display:none}body{padding-bottom:0}}
main{padding:0 16px 24px;max-width:1200px;margin:auto}
h2{font-size:20px;margin:24px 0 10px}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.card{flex:0 0 130px;background:var(--card);border:0;border-radius:6px;overflow:hidden;text-align:left;scroll-snap-align:start;padding:0;position:relative}
.card img,.ph{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#2c251f}
.card span{display:block;padding:6px 8px;font:13px/1.3 system-ui}
.tag{position:absolute;top:6px;left:6px;background:#000a;font:11px system-ui;padding:2px 6px;border-radius:4px}
.prog{height:3px;background:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.grid .card{flex:auto}
.hero{position:relative;min-height:46vh;border-radius:10px;overflow:hidden;background:#2c251f center/cover;display:flex;align-items:flex-end}
.hero div{padding:20px;background:linear-gradient(transparent,#14110fee);width:100%}
.hero h1{margin:0 0 6px;font-size:clamp(26px,5vw,44px)}
.empty{border:1px dashed #4a3f35;border-radius:10px;padding:28px;text-align:center;color:var(--mut);font-family:system-ui}
.skel{height:195px;flex:0 0 130px;border-radius:6px;background:linear-gradient(90deg,#211c18,#2c251f,#211c18);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

.dbody{padding:16px;font-family:system-ui}.dbody h3{font:700 24px Georgia,serif;margin:8px 0}
video{width:100%;max-height:70vh;background:#000;display:block}
.note{font:12px system-ui;color:var(--mut)}
input.s{width:100%;padding:12px;border-radius:8px;border:1px solid #4a3f35;background:var(--card);margin:8px 0}
.plans{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.plan{background:var(--card);padding:16px;border-radius:10px;font-family:system-ui}

:root{--bg:#000;--card:#0e0e12;--fg:#f5f3ff;--mut:#8f8aa3;--c1:#8b5cf6;--c2:#ff4d7e;--c3:#22d3ee;--g:linear-gradient(120deg,var(--acc),var(--c2) 55%,var(--c1))}
body{background:radial-gradient(60% 40% at 85% -5%,#8b5cf633,transparent),radial-gradient(50% 35% at 0 12%,#ff4d7e22,transparent),#000;background-attachment:fixed;font-family:Inter,"SF Pro Display",system-ui,sans-serif}
.sr{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;margin:0}
.dd{position:relative;display:block;margin:3px 0 8px}
.ddb{width:100%;text-align:left;background:#0e0e12;color:var(--fg);border:1px solid #2a2740;border-radius:12px;padding:10px 36px 10px 12px;font:inherit;cursor:pointer;position:relative;transition:border-color .2s}
.ddb:after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border:solid var(--mut);border-width:0 2px 2px 0;transform:translateY(-70%) rotate(45deg);transition:transform .2s}
.dd.open .ddb{border-color:var(--c1)}.dd.open .ddb:after{transform:translateY(-30%) rotate(225deg)}
.dd ul{display:none;position:absolute;z-index:50;left:0;right:0;top:calc(100% + 6px);max-height:260px;overflow:auto;margin:0;padding:6px;list-style:none;background:#101016f2;backdrop-filter:blur(18px);border:1px solid #2a2740;border-radius:14px;box-shadow:0 20px 50px #000}
.dd.open ul{display:block}
.dd li{padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--fg);font-size:14px}
.dd li:hover,.dd li:focus{background:#8b5cf633;outline:0}.dd li[aria-selected=true]{background:var(--g);color:#000;font-weight:600}

header{position:sticky;top:0;z-index:20;backdrop-filter:blur(18px);background:#000a;border-bottom:1px solid #ffffff12}
.logo{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}.logo b{color:inherit}
nav.top{background:#ffffff0d;border:1px solid #ffffff14;border-radius:999px;padding:4px;margin:0 auto}

nav.bot{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border-radius:22px;background:#0b0b10cc;backdrop-filter:blur(20px);border:1px solid #ffffff1a;padding:6px}

body{padding-bottom:100px}@media(min-width:760px){body{padding-bottom:0}}

.tag{background:var(--g);color:#000;font-weight:600}

.lnk{background:none;border:0;color:var(--acc);text-decoration:underline;font:inherit;padding:6px 2px;cursor:pointer}

/* ===== Premium buttons (compact) ===== */
.pbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 16px;border-radius:999px;border:1px solid transparent;background:var(--g);color:#0a0a0f;font:600 13px/1 system-ui;letter-spacing:.01em;white-space:nowrap;cursor:pointer;box-shadow:0 4px 14px #8b5cf633;transition:box-shadow .2s,background .2s,transform .15s}
.pbtn:hover{box-shadow:0 6px 20px #8b5cf655}.pbtn:active{transform:scale(.97)}
.pbtn.ghost{background:#ffffff0d;border-color:#ffffff1f;color:var(--fg);box-shadow:none}.pbtn.ghost:hover{background:#ffffff1a}
.pbtn.danger{background:none;border-color:#ff4d7e55;color:#ff8fae;box-shadow:none}.pbtn.danger:hover{background:#ff4d7e1a}

 background:linear-gradient(#0e0e12,#0e0e12) padding-box,linear-gradient(160deg,#ffffff2e,#ffffff0a 45%,#8b5cf666) border-box;box-shadow:0 18px 44px #00000066}
.pcard.cur{background:linear-gradient(#0e0e12,#0e0e12) padding-box,var(--g) border-box;box-shadow:0 20px 50px #8b5cf62e}
.pch{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pcard h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}

  switch(sec.source){
    case'featured':l=l.filter(m=>m.featured);break;
    case'free':l=l.filter(m=>m.access==='free');break;
    case'premium':l=l.filter(m=>m.access==='premium');break;

    case'recent_release':l.sort((a,b)=>String(b.releaseDate||'').localeCompare(a.releaseDate||''));break;
    case'popular':l.sort((a,b)=>(b.popularity||0)-(a.popularity||0));break;

function ago(t){const m=Math.round((Date.now()-t)/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'}
function renderProfile(app){const u=Auth.user(),hs=History.all(),all=Movies.all(),act=DB.get('activity',[]).filter(a=>a.userId===u.id);
 const played=Object.entries(hs).map(([id,h])=>({m:all.find(x=>x.id===id),h})).filter(x=>x.m).sort((a,b)=>b.h.updated-a.h.updated),last=played[0];
 const secs=played.reduce((n,x)=>n+(x.h.pos||0),0),time=secs>=3600?(secs/3600).toFixed(1)+' h':Math.round(secs/60)+' min';
 const sub=DB.get('subs',[]).filter(x=>x.userId===u.id).sort((a,b)=>b.startedAt-a.startedAt)[0],plan=sub&&DB.get('plans',[]).find(p=>p.id===sub.planId),on=Subs.active();
 const name=u.name||u.email.split('@')[0],fmt=t=>t?new Date(t).toLocaleString():'unknown';
 app.innerHTML=`<section class="pf"><div class="pfh"><div class="avatar big">${esc(name[0].toUpperCase())}</div><div><h1>${esc(name)}</h1><p class="note">${esc(u.email)}</p>
  <p class="note">Member since ${new Date(u.created).toLocaleDateString()} | Last sign-in ${fmt(u.lastLogin)}</p></div></div>
 <div class="stats2"><div><b>${played.length}</b>Titles watched</div><div><b>${time}</b>Time watched</div><div><b>${Watchlist.all().length}</b>In My List</div><div><b>${C._plays||0}</b>Plays</div></div>
 <h2>Last played</h2>${last?`<button class="lastp" data-m="${esc(last.m.id)}">${last.m.poster?`<img src="${img(last.m.poster)}" alt="" onerror="this.remove()">`:'<div class="ph" style="width:70px"></div>'}<div><b>${esc(last.m.title)}</b><span class="note">${ago(last.h.updated)} | ${last.h.dur?Math.round(last.h.pos/last.h.dur*100)+'% watched':'started'}</span><div class="pbar"><i style="width:${Math.min(100,last.h.pos/last.h.dur*100||0)}%"></i></div></div><span class="pbtn">Resume</span></button>`:empty('Nothing played yet','Start a title and it will show up here.')}
 ${played.length>1?`<h2>Watched recently</h2><div class="row">${played.slice(1,9).map(x=>card(x.m,x.h)).join('')}</div>`:''}
 <h2>Subscription</h2><div class="plan sub">${on&&plan?`<div><span class="pill">Active</span><b>${esc(plan.name)}</b><span class="note">${sub.expires?'Expires '+new Date(sub.expires).toLocaleDateString():'No end date'}</span></div>`:`<span class="note">No active subscription.</span>`}${Subs.plans().length?`<button class="pbtn ghost" data-v="sub">${on&&plan?'Manage plan':'View plans'}</button>`:''}</div>
 <h2>Recent activity</h2>${act.length?`<div class="plan">${act.slice(-8).reverse().map(a=>`<p class="note" style="margin:4px 0"><b>${esc(a.type.replace(/_/g,' '))}</b> ${esc(a.detail||'')} <span>${ago(a.at)}</span></p>`).join('')}</div>`:empty('No activity yet','')}
 <h2>Account</h2><div class="acct"><div class="plan"><b>Display name</b><label class="note" for="dn">Shown on your profile</label><input class="s" id="dn" value="${esc(u.name||'')}" placeholder="${esc(u.email.split('@')[0])}" maxlength="40"><button class="pbtn" id="sv">Save name</button></div>
  <div class="plan"><b>Password</b><label class="note" for="cp">Change password</label><input class="s" id="cp" type="password" placeholder="Current password" autocomplete="current-password"><input class="s" id="np" type="password" placeholder="New password" autocomplete="new-password">
  <p id="pmsg" class="note" role="status" style="margin:0 0 10px"></p><button class="pbtn" id="cpb">Update password</button></div></div>
 <div class="pfoot"><button class="pbtn ghost" data-act="logout">Sign out</button><button class="pbtn ghost" data-act="hist">Clear watch history</button><button class="pbtn danger" id="del">Delete account</button></div></section>`;
 const msg=(t,ok)=>{const e=$('#pmsg');e.textContent=t;e.style.color=ok?'#9bd89b':'#ff9b8a'};
$('#sv').onclick=async()=>{const{error}=await sb.from('profiles').update({name:$('#dn').value.trim().slice(0,40)}).eq('id',u.id);if(error)return toast('Could not save: '+error.message);await Auth.load();Activity.log('profile_updated','display name');render()};
 $('#cpb').onclick=async()=>{try{await Auth.changePassword($('#cp').value,$('#np').value);$('#cp').value=$('#np').value='';msg('Password updated.',true)}catch(e){msg(e.message)}};
 $('#del').onclick=async()=>{if(!confirm('Delete your account and its history? This cannot be undone.'))return;const{error}=await sb.rpc('delete_my_account');if(error)return toast('Could not delete account: '+error.message);
  Auth._u=null;await sb.auth.signOut();state.auth='login';state.view='home';render()}}
function renderPlans(app){const p=Subs.plans(),me=Auth.user(),on=Subs.active();
  const cur=on&&DB.get('subs',[]).filter(x=>x.userId===me.id&&x.status==='active'&&(!x.expires||x.expires>Date.now())).sort((a,b)=>b.startedAt-a.startedAt)[0],curId=cur&&cur.planId;
  const money=x=>{try{return new Intl.NumberFormat(undefined,{style:'currency',currency:x.currency,maximumFractionDigits:2}).format(x.price)}catch(e){return esc(x.price)+' '+esc(x.currency)}};
  const cta=x=>x.id===curId?'<button class="pbtn ghost block" disabled>Active</button>':/^https:\/\//i.test(x.checkoutUrl||'')?`<a class="pbtn block" style="text-decoration:none" target="_blank" rel="noopener" href="${esc(x.checkoutUrl+(x.checkoutUrl.includes('?')?'&':'?')+'client_reference_id='+me.id+'&prefilled_email='+encodeURIComponent(me.email))}">Choose plan</a>`:'<button class="pbtn ghost block" disabled>Not open yet</button>';
  app.innerHTML=`<h2>Subscription</h2>`+
  (p.length?`<div class="plans">${p.map(x=>`<div class="pcard ${x.id===curId?'cur':''}"><div class="pch"><h3>${esc(x.name)}</h3>${x.id===curId?'<span class="pill">Current plan</span>':''}</div>${x.description?`<p class="pd">${esc(x.description)}</p>`:''}<div class="pr"><b>${money(x)}</b><span>/ ${esc(x.interval)}</span></div><ul>${(x.benefits||[]).map(b=>`<li>${esc(b)}</li>`).join('')}</ul>${cta(x)}</div>`).join('')}</div>`:empty('No plans available','Plans will appear here once an administrator publishes them.'))+
  (on?`<div class="psub"><span>Your subscription is active. Contact support to change or cancel it.</span></div>`:'')}

/* ----- Detail + player ----- */
function openMovie(id){const m=Movies.byId(id);if(!m)return;if(!$('#dlg').open)Activity.log('view_title',m.title);const d=$('#dlg'),st=Playback.canWatch(m),inList=Watchlist.all().includes(id);
  const trailer=m.trailerKey?`<p><a href="https://www.youtube.com/watch?v=${esc(m.trailerKey)}" target="_blank" rel="noopener" style="color:var(--acc)">Watch trailer</a></p>`:'';
  d.innerHTML=`<div id="stage">${m.backdrop?`<img src="${imgL(m.backdrop)}" alt="" style="width:100%;display:block" onerror="this.remove()">`:''}</div><div class="dbody">
  <h3>${esc(m.title)}</h3><p class="note">${[m.releaseDate?m.releaseDate.slice(0,4):'',m.runtime?m.runtime+' min':'',(m.genres||[]).join(', '),m.language?m.language.toUpperCase():'',m.rating?'TMDB '+m.rating.toFixed(1):''].filter(Boolean).join(' | ')}</p>
  <p>${esc(m.overview||'')}</p>${(m.cast||[]).length?`<p class="note">Cast: ${(m.cast).map(esc).join(', ')}</p>`:''}${trailer}
  <p>${st==='ok'?`<button class="btn" id="pl">Play</button>`:st==='premium'?`<button class="btn" data-v="sub" id="up">Premium: see plans</button>`:'<span class="note">Not available to watch yet. Details only.</span>'}
  <button class="btn alt" id="wl">${inList?'Remove from My List':'Add to My List'}</button> <button class="btn alt" id="cl">Close</button></p>
  <p class="note">Metadata from TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.</p></div>`;
  d.showModal();$('#cl').onclick=()=>d.close();
  $('#wl').onclick=()=>{Watchlist.toggle(id);openMovie(id)};
  const up=$('#up');if(up)up.addEventListener('click',()=>d.close());
  const pl=$('#pl');if(pl)pl.onclick=()=>play(m)}

function realPlay(m){const stage=$('#stage'),v=document.createElement('video');v.controls=true;v.playsInline=true;v.preload='metadata';
  const tracks=(m.video.subtitles||[]).map(s=>`<track kind="subtitles" src="${esc(s.url)}" srclang="${esc(s.lang)}" label="${esc(s.label)}">`).join('');
  v.src=m.video.url;v.innerHTML=tracks;
  const hs=History.all()[m.id];if(hs&&hs.pos>5)v.addEventListener('loadedmetadata',()=>{v.currentTime=hs.pos},{once:true});
  const bar=document.createElement('p');bar.className='note';bar.style.padding='8px 16px';
  const ad=false;bar.textContent='';
  stage.replaceChildren(v,bar);
  if((m.video.qualities||[]).length){const q=document.createElement('div');q.className='dbody';q.innerHTML=`<select id="qs" aria-label="Quality"><option value="">Default source</option>${m.video.qualities.map((x,i)=>`<option value="${i}">${esc(x.label)}</option>`).join('')}</select>`;stage.append(q);enhance(q);
   $('#qs').onchange=e=>{const t=v.currentTime,s=e.target.value===''?m.video.url:m.video.qualities[+e.target.value].url;v.src=s;v.addEventListener('loadedmetadata',()=>{v.currentTime=t;v.play()},{once:true})}}
  let last=0;v.ontimeupdate=()=>{if(Date.now()-last>5000){last=Date.now();History.save(m.id,v.currentTime,v.duration)}};
  v.onwaiting=()=>bar.textContent='Buffering…';v.onplaying=()=>bar.textContent='';
  v.onerror=()=>{bar.innerHTML='Playback failed: the source is missing or the format is unsupported. <button class="btn alt" id="rt">Retry</button>';$('#rt').onclick=()=>{v.load();v.play()}};
  v.play().catch(()=>{});Analytics.log('play',m.id)}


/* ----- Auth (Supabase Auth) and activity ----- */
const Activity={log(type,detail){const u=Auth.user();if(!u)return;
 sb.from('activity').insert({type,detail:detail||'',user_id:u.id,source:'user-app'}).then(({error})=>{if(error)return console.warn('activity not recorded:',error.message);
  (C.activity=C.activity||[]).push({id:uid(),at:Date.now(),type,detail:detail||'',userId:u.id,email:u.email,source:'user-app'});if(type==='play')C._plays=(C._plays||0)+1})}};
const Auth={_u:null,user:()=>Auth._u,
 async load(){const{data:{session}}=await sb.auth.getSession();if(!session){Auth._u=null;return}
  const p=(await pull(sb.from('profiles').select('*').eq('id',session.user.id)))[0];
  if(!p){Auth._u=null;await sb.auth.signOut();throw Error('Your profile was not found. Ask the administrator to run the database migration.')}
  if(p.disabled){Auth._u=null;await sb.auth.signOut();throw Error('This account has been disabled by an administrator.')}
  Auth._u={id:p.id,email:p.email,name:p.name||'',role:p.role,created:ms(p.created_at),lastLogin:ms(p.last_login)}},
 async register(email,pw){email=email.trim().toLowerCase();
  if(!/^\S+@\S+\.\S+$/.test(email))throw Error('Enter a valid email.');const cfg=Settings.get();if(cfg.allowRegistration===false)throw Error('Registration is currently closed.');if(pw.length<cfg.passwordMin)throw Error('Password needs at least '+cfg.passwordMin+' characters.');
  const{data,error}=await sb.auth.signUp({email,password:pw});if(error)throw Error(/already/i.test(error.message)?'This email is already registered.':error.message);
  if(!data.session)throw Error('Check your email to confirm your account, then sign in.');
  await Auth.load();await hydrate();Activity.log('register','')},
 async login(email,pw){const{error}=await sb.auth.signInWithPassword({email:email.trim().toLowerCase(),password:pw});
  if(error)throw Error(/invalid login/i.test(error.message)?'Incorrect email or password.':error.message);
  await Auth.load();await hydrate();sb.from('profiles').update({last_login:new Date().toISOString()}).eq('id',Auth.user().id).then(()=>{});Activity.log('login','')},
 async changePassword(cur,nw){const u=Auth.user(),cfg=Settings.get();
  const{error:e1}=await sb.auth.signInWithPassword({email:u.email,password:cur});if(e1)throw Error('Current password is incorrect.');
  if(nw.length<cfg.passwordMin)throw Error('New password needs at least '+cfg.passwordMin+' characters.');
  const{error}=await sb.auth.updateUser({password:nw});if(error)throw Error(error.message);Activity.log('password_changed','')},
 async logout(){Activity.log('logout','');const id=(Auth.user()||{}).id;Auth._u=null;Object.keys(C).forEach(k=>{if(/^(history|watchlist):/.test(k)||k==='subs'||k==='activity')delete C[k]});await sb.auth.signOut()}};
function authDlg(m){state.auth=m==='register'?'register':'login';render()}
/* Two separate pages (#/login and #/register). Sessions are Supabase Auth sessions; access is enforced by Row Level Security. */
function renderAuth(){document.body.classList.add('gate');const open=Settings.get().allowRegistration!==false;if(!state.auth||!open)state.auth='login';const reg=state.auth==='register',s=Settings.get();
 $('#app').innerHTML=`<section class="authp"><div class="logo big has-ic"><img class="gl" src="${GP_ICON}" alt="" width="40" height="40"><span class="lt">${esc(s.appName)}</span></div><h1>${reg?'Create your account':'Welcome back'}</h1>
 <p class="note">${reg?'Register to start watching.':'Sign in to continue.'}</p>
 <form id="af" novalidate><label for="ae">Email</label><input class="s" id="ae" type="email" autocomplete="email" required>
 <label for="ap">Password</label><input class="s" id="ap" type="password" autocomplete="${reg?'new-password':'current-password'}" required>
 ${reg?'<label for="ap2">Confirm password (min '+Settings.get().passwordMin+' characters)</label><input class="s" id="ap2" type="password" autocomplete="new-password" required>':''}
 <p id="aerr" class="note" style="color:#ff9b8a" role="alert"></p><button class="btn wide" id="ago" type="submit">${reg?'Create account':'Sign in'}</button></form>
 <p class="note">${reg?'Already have an account? <button type="button" class="lnk" data-auth="login">Sign in</button>':(open?'New here? <button type="button" class="lnk" data-auth="register">Create an account</button>':'Registration is currently closed.')}</p>
 </section>`;
 $('#af').onsubmit=async e=>{e.preventDefault();const err=$('#aerr');err.textContent='';
  try{if(reg&&$('#ap').value!==$('#ap2').value)throw Error('Passwords do not match.');
   $('#ago').disabled=true;Loader.show();await Auth[reg?'register':'login']($('#ae').value,$('#ap').value);state.view='home';state.auth=null;render();Loader.hide(300)}
  catch(x){Loader.hide(0);err.textContent=x.message;$('#ago').disabled=false}};
 $('#ae').focus()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-auth]');if(t){state.auth=t.dataset.auth;render()}});
/* ----- Playback: the video URL is only released by the get_playback database function after access checks ----- */
async function play(m){const stage=$('#stage');stage.innerHTML='<p class="note" style="padding:16px" role="status">Loading video…</p>';
 try{const{data,error}=await sb.rpc('get_playback',{p_movie:m.id});if(error)throw error;
  const sign=async u=>{if(!u||!u.startsWith('storage:'))return u;const p=u.slice(8),i=p.indexOf('/'),{data:d,error:e}=await sb.storage.from(p.slice(0,i)).createSignedUrl(p.slice(i+1),3600);if(e)throw e;return d.signedUrl};
  const v={url:await sign(data.url),qualities:await Promise.all((data.qualities||[]).map(async q=>({label:q.label,url:await sign(q.url)}))),subtitles:await Promise.all((data.subtitles||[]).map(async x=>({...x,url:await sign(x.url)})))};
  realPlay({...m,video:v})}
 catch(e){stage.innerHTML='<p class="note" style="padding:16px;color:#ff9b8a" role="alert">'+esc(e.message||'Playback unavailable')+'</p><div class="dbody"><button class="pbtn ghost" id="rt2">Try again</button></div>';$('#rt2').onclick=()=>play(m)}}
/* ----- PWA manifest generated at runtime (no extra files; no service worker, so offline is not supported) ----- */
(()=>{try{const s=Settings.get(),m={name:s.appName,short_name:s.appName,display:'standalone',background_color:'#000000',theme_color:'#000000',start_url:location.href,icons:[{src:GP_ICON,sizes:'192x192',type:'image/png'}]};
 const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.append(l)}catch(e){}})();

function sortBy(l,k){const c={new:(a,b)=>(b.addedAt||0)-(a.addedAt||0),pop:(a,b)=>(b.popularity||0)-(a.popularity||0),az:(a,b)=>a.title.localeCompare(b.title),rate:(a,b)=>(b.rating||0)-(a.rating||0)};return [...l].sort(c[k]||c.new)}
document.addEventListener('change',e=>{if(e.target.id==='q'){const v=e.target.value.trim();if(v.length>1)DB.set('recent',[v,...DB.get('recent',[]).filter(x=>x!==v)].slice(0,6))}});
document.addEventListener('click',e=>{const c=e.target.closest('[data-rs]');if(c){state.q=c.dataset.rs;render()}
 const a=e.target.closest('[data-act]');if(a){if(a.dataset.act==='hist'&&confirm('Clear all watch history?')){DB.set(UK('history'),{});render()}if(a.dataset.act==='rs'){DB.set('recent',[]);render()}if(a.dataset.act==='login')authDlg('login');if(a.dataset.act==='logout'){Auth.logout().then(()=>{state.auth='login';render()})}}});

function enhance(root){root.querySelectorAll('select:not([data-e])').forEach(s=>{s.dataset.e=1;s.classList.add('sr');
 const w=document.createElement('div'),b=document.createElement('button'),u=document.createElement('ul');
 w.className='dd';b.type='button';b.className='ddb';b.setAttribute('aria-haspopup','listbox');b.setAttribute('aria-expanded','false');
 if(s.getAttribute('aria-label'))b.setAttribute('aria-label',s.getAttribute('aria-label'));u.setAttribute('role','listbox');
 const sync=()=>{b.textContent=s.options[s.selectedIndex]?s.options[s.selectedIndex].text:'';[...u.children].forEach((li,i)=>li.setAttribute('aria-selected',i===s.selectedIndex))};
 const shut=()=>{w.classList.remove('open');b.setAttribute('aria-expanded','false')};
 [...s.options].forEach((o,i)=>{const li=document.createElement('li');li.setAttribute('role','option');li.tabIndex=-1;li.textContent=o.text;
  li.onclick=()=>{s.selectedIndex=i;sync();shut();s.dispatchEvent(new Event('change',{bubbles:true}))};
  li.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();li.click()}if(e.key==='ArrowDown'){e.preventDefault();(li.nextElementSibling||li).focus()}if(e.key==='ArrowUp'){e.preventDefault();(li.previousElementSibling||li).focus()}if(e.key==='Escape'){shut();b.focus()}};u.append(li)});
 b.onclick=e=>{e.stopPropagation();document.querySelectorAll('.dd.open').forEach(d=>d!==w&&d.classList.remove('open'));const o=w.classList.toggle('open');b.setAttribute('aria-expanded',o);if(o)(u.children[s.selectedIndex]||u.firstChild).focus()};
 s.after(w);w.append(b,u);sync()})}
document.addEventListener('click',()=>document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open')));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open'))});
new MutationObserver(()=>enhance($('#app'))).observe($('#app'),{childList:true});enhance($('#app'));

boot();
